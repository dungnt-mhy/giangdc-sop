# giangdc-sop demo API (Cloudflare Worker)
name = "giangdc-sop-demo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "giangdc-sop-demo"
database_id = "1d74db80-66b9-4ddc-99c7-dc4c8ffdf195"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "giangdc-sop-demo"

[vars]
# Origin của web được phép gọi API kèm cookie.
CORS_ORIGIN = "https://giangdc-sop-app.pages.dev,https://dungnt-mhy.github.io"
