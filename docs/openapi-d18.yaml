# OpenAPI bổ sung D-18 (18/10/2026) — nhật ký duyệt + Thông tin lượt công việc đầy đủ.
# Giữ nguyên docs/openapi-t3.yaml (T3), docs/openapi-t3-d14.yaml (D-14),
# docs/openapi-d15.yaml (D-15), docs/openapi-d16.yaml (D-16).
# Thay đổi so với D-16:
# - Migration 0011: bảng execution_reviews (id, execution_id, action
#   submit|approve|reject|cancel_submit, actor_id, reason, created_at + index);
#   executions thêm cột started_at (thời điểm bấm Bắt đầu).
# - POST /executions/{id}/start: lưu started_at (CREATED -> IN_PROGRESS).
# - POST /executions/{id}/submit|approve|reject|cancel-submit: sau transition thành
#   công, ghi một dòng vào execution_reviews (actor = người gọi, reason cho reject).
# - GET /executions/{id} (và list): ExecutionDto thêm startedAt (string|null) và
#   reviews: ExecutionReviewDto[] (mới nhất trước, kèm actorName từ users).
# - Web: mục "Thông tin lượt công việc" — trạng thái + badge "Bị trả lại làm lại"
#   (review mới nhất là reject và lượt đang thực hiện), "Lịch sử từ chối (N lần)",
#   Quy trình, Ngày thực hiện (dự kiến), Bắt đầu lúc, Người tạo, Người thực hiện chính,
#   Người duyệt (giám sát hoặc người đã xác nhận), Đơn vị, Ghi chú, Tiến độ X/Y (Z%).
openapi: 3.0.3
info:
  title: SOP Execution API — D-18
  version: 1.7.0
paths:
  /executions/{id}/start:
    post:
      summary: Bắt đầu lượt (CREATED -> IN_PROGRESS). D-18: lưu started_at.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới (startedAt đã set) }
        '409': { description: EXECUTION_STATE_INVALID }
  /executions/{id}/submit:
    post:
      summary: Báo hoàn thành. D-18: ghi review action=submit (sau transition 200).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới + 1 dòng execution_reviews }
  /executions/{id}/approve:
    post:
      summary: Xác nhận hoàn thành. D-18: ghi review action=approve.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution APPROVED + 1 dòng execution_reviews }
  /executions/{id}/reject:
    post:
      summary: Từ chối xác nhận (lý do bắt buộc). D-18: ghi review action=reject kèm reason.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution IN_PROGRESS + 1 dòng execution_reviews }
        '400': { description: REASON_REQUIRED }
  /executions/{id}/cancel-submit:
    post:
      summary: Hủy báo hoàn thành. D-18: ghi review action=cancel_submit.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution IN_PROGRESS + 1 dòng execution_reviews }
components:
  schemas:
    ExecutionReviewDto:
      type: object
      properties:
        id: { type: string }
        action: { type: string, enum: [submit, approve, reject, cancel_submit] }
        actorId: { type: string }
        actorName: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        createdAt: { type: string }
