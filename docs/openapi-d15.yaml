# OpenAPI bổ sung D-15 (18/10/2026) — bằng chứng mở rộng, trạng thái lượt + duyệt, thông báo.
# Giữ nguyên docs/openapi-t3.yaml (T3) và docs/openapi-t3-d14.yaml (D-14).
openapi: 3.0.3
info:
  title: SOP Execution API — D-15
  version: 1.5.0
paths:
  /executions/{id}/start:
    post:
      summary: Bắt đầu lượt (CREATED -> IN_PROGRESS)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới }
        '409': { description: EXECUTION_STATE_INVALID }
  /executions/{id}/pause:
    post:
      summary: Tạm dừng lượt (IN_PROGRESS -> PAUSED)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới }
        '409': { description: EXECUTION_STATE_INVALID }
  /executions/{id}/resume:
    post:
      summary: Tiếp tục lượt (PAUSED -> IN_PROGRESS)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới }
        '409': { description: EXECUTION_STATE_INVALID }
  /executions/{id}/submit:
    post:
      summary: Gửi duyệt (COMPLETED -> PENDING_APPROVAL). Quyền: người tạo lượt hoặc execution.operate.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới + thông báo tới người duyệt }
        '403': { description: FORBIDDEN }
        '409': { description: EXECUTION_STATE_INVALID }
  /executions/{id}/cancel-submit:
    post:
      summary: Hủy gửi duyệt (PENDING_APPROVAL -> COMPLETED). Chỉ người đã gửi hoặc senior.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới }
        '403': { description: FORBIDDEN }
  /executions/{id}/approve:
    post:
      summary: Duyệt lượt (PENDING_APPROVAL -> APPROVED). Người duyệt = supervisor của lượt hoặc senior_approver.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Execution mới + thông báo tới người gửi }
        '403': { description: FORBIDDEN }
  /executions/{id}/reject:
    post:
      summary: Từ chối duyệt (PENDING_APPROVAL -> COMPLETED, lý do bắt buộc).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Execution mới + thông báo tới người gửi }
        '400': { description: REASON_REQUIRED }
        '403': { description: FORBIDDEN }
  /executions/{id}/steps/{stepId}/evidence:
    post:
      summary: Upload bằng chứng (D-15: giới hạn 5MB; PHOTO = ảnh, FILE = PDF/Word/Excel).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: stepId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
                kind: { type: string, enum: [PHOTO, FILE] }
      responses:
        '201': { description: Evidence đã lưu }
        '400': { description: INVALID_MIME | FILE_TOO_LARGE (5MB) }
  /executions/pending-approval-count:
    get:
      summary: Số lượt chờ duyệt mà tôi được duyệt (badge menu).
      responses:
        '200':
          description: '{ count: number }'
  /notifications:
    get:
      summary: Thông báo của tôi (chưa đọc trước, limit 50).
      responses:
        '200': { description: '{ items: NotificationDto[] }' }
  /notifications/unread-count:
    get:
      summary: Số thông báo chưa đọc (badge chuông).
      responses:
        '200': { description: '{ count: number }' }
  /notifications/{id}/read:
    post:
      summary: Đánh dấu đã đọc.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ ok: boolean }' }
components:
  schemas:
    ExecutionState:
      type: string
      enum: [CREATED, IN_PROGRESS, PAUSED, BLOCKED, COMPLETED, PENDING_APPROVAL, APPROVED, CANCELLED]
    NotificationDto:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [execution.submitted, execution.approved, execution.rejected, step.assigned] }
        title: { type: string }
        body: { type: string, nullable: true }
        refType: { type: string, nullable: true }
        refId: { type: string, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string }
